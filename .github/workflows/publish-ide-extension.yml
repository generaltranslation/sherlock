name: Publish Sherlock (VS Code extension)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packaged version (false verifies both registries without publishing)
        type: boolean
        default: false
  push:
    paths:
      - "package.json"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sherlock-publishing
  cancel-in-progress: false

jobs:
  vs-code-marketplace:
    if: github.repository == 'generaltranslation/sherlock' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry trusted publishing without publishing
        run: node scripts/verify-publishing.mjs

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Build Visual Studio Code extension (Sherlock) package
        run: pnpm run package

      - name: Publish to Visual Studio Code Marketplace
        if: github.event_name == 'push' || inputs.publish
        run: pnpm exec vsce publish --oidc --packagePath "vs-code-extension-$(node -p 'require("./package.json").version').vsix"

      - name: Publish to Open VSX Registry
        if: github.event_name == 'push' || inputs.publish
        run: pnpm run publish:open-vsx
